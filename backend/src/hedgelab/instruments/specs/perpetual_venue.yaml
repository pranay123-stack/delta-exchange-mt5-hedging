# Perpetual-exchange instrument catalogue (Delta-Exchange-style).
#
# These are ILLUSTRATIVE specifications modelled on the shape of a public
# perpetual contract spec.  They are configuration, not code: the engine never
# references any symbol here by name.  Edit, add or delete freely -- including
# at runtime through /instruments -- and the platform adapts.
#
# venue_kind: PERPETUAL_EXCHANGE | MT5_BROKER | SPOT_EXCHANGE
# quantity_unit: CONTRACT | LOT | BASE_UNIT
# settlement_style: LINEAR | INVERSE

instruments:
  - symbol: BTCUSDT-PERP
    venue: PAPER_DELTA
    venue_kind: PERPETUAL_EXCHANGE
    instrument_type: PERPETUAL
    display_name: Bitcoin Perpetual (linear, USDT settled)
    base_asset: BTC
    quote_asset: USDT
    settlement_asset: USDT
    underlying_key: BTC
    quantity_unit: CONTRACT
    settlement_style: LINEAR
    contract_size: "0.001"          # 1 contract = 0.001 BTC
    contract_multiplier: "1"
    tick_size: "0.5"
    min_quantity: "1"
    max_quantity: "500000"
    quantity_step: "1"
    price_precision: 1
    quantity_precision: 0
    max_leverage: "50"
    margin_model: ISOLATED_LINEAR
    initial_margin_rate: "0.02"
    maintenance_margin_rate: "0.005"
    maker_fee_bps: "2"
    taker_fee_bps: "5"
    typical_spread_bps: "1.5"
    funding_model: PERPETUAL_FUNDING
    funding_interval_hours: "8"
    baseline_funding_rate: "0.0001"  # +1 bp per 8h -> longs pay
    price_source: simulator

